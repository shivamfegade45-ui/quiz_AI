<!DOCTYPE html>
<html>

<head>

    <title>{{ topic }} Quiz</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px #aaa;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .question {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .option {
            display: block;
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .option:hover {
            background: #e0e7ff;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 14px 40px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        🤖 {{ topic|upper }} QUIZ
    </h1>

    <form action="/result" method="POST">

        <!-- Store topic -->
        <input
            type="hidden"
            name="topic"
            value="{{ topic }}"
        >


        {% for q in quiz %}

            {% set question_number = loop.index0 %}

            <div class="question">

                <h3>
                    {{ loop.index }}.
                    {{ q.question }}
                </h3>


                {% for option in q.options %}

                    <label class="option">

                        <input
                            type="radio"
                            name="q{{ question_number }}"
                            value="{{ option }}"
                            required
                        >

                        {{ option }}

                    </label>

                {% endfor %}

            </div>

        {% endfor %}


        <button type="submit">

            Submit Quiz ✅

        </button>

    </form>

</div>

</body>

</html>
